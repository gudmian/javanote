services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: javanote
      POSTGRES_USER: javanote
      POSTGRES_PASSWORD: javanote
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: javanote
      MONGO_INITDB_ROOT_PASSWORD: javanote
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  kafka:
    image:  apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/tmp/kafka-logs
  postgres-push:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: push_service
      POSTGRES_USER: push_service
      POSTGRES_PASSWORD: push_service
    ports:
      - "5434:5432"
    volumes:
      - postgres-push-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  postgres-push-data: